<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickStare - All Deliveries</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo"><i class="fa-solid fa-truck-fast"></i> BrickStare</div>
            <nav>
    <a href="index.html" class="nav-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="deliveries.html" class="nav-link active"><i class="fa-solid fa-box-open"></i> All Deliveries</a>
    <a href="riders.html" class="nav-link"><i class="fa-solid fa-motorcycle"></i> Riders</a>
    <a href="reports.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Reports</a>
<button type="button" class="nav-link logout-link" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</nav>
        </aside>

        <main class="main-content">
            <header>
                <h2>All Deliveries</h2>
                <div class="user-profile">
                    <span id="dispatcherName">Dispatcher</span>
                    <i class="fa-solid fa-circle-user"></i>
                </div>
            </header>

           <!-- Filter Buttons -->
<div class="filter-bar">
    <button class="filter-btn active" onclick="filterDeliveries('all')">All</button>
    <button class="filter-btn" onclick="filterDeliveries('pending')">Pending</button>
    <button class="filter-btn" onclick="filterDeliveries('assigned')">Assigned</button>
    <button class="filter-btn" onclick="filterDeliveries('in_transit')">In Transit</button>
    <button class="filter-btn" onclick="filterDeliveries('delivered')">Delivered</button>
</div>

<div class="panel">
    <div id="all-deliveries-list" class="list-container"></div>
</div>

        </main>
    </div>

       <script src="deliveries.js"></script>
</body>
</html>
