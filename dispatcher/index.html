<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickStare - Dispatch Portal</title>
    
    <!-- 🔒 AUTHENTICATION CHECK: Redirects to login if no token exists -->
<!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Our Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-truck-fast"></i> BrickStare
            </div>
            <nav>
    <a href="index.html" class="nav-link active"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="deliveries.html" class="nav-link"><i class="fa-solid fa-box-open"></i> All Deliveries</a>
    <a href="riders.html" class="nav-link"><i class="fa-solid fa-motorcycle"></i> Riders</a>
    <a href="reports.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Reports</a>
<button type="button" class="nav-link logout-link" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <h2>Operations Dashboard</h2>
                <div class="user-profile">
                    <span id="dispatcherName">Dispatcher</span>
                    <i class="fa-solid fa-circle-user"></i>
                </div>
            </header>

            <!-- Stats Row -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Pending Orders</h3>
                    <p id="stat-pending">0</p>
                </div>
                <div class="stat-card">
                    <h3>Active Riders</h3>
                    <p id="stat-riders">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completed Today</h3>
                    <p>12</p>
                </div>
            </div>

            <!-- Split View: Deliveries & Riders -->
            <div class="split-view">
                <div class="panel">
                    <h3><i class="fa-solid fa-clock"></i> Pending Deliveries</h3>
                    <div id="deliveries-list" class="list-container">Loading...</div>
                </div>

                <div class="panel">
                    <h3><i class="fa-solid fa-users"></i> Available Riders</h3>
                    <div id="riders-list" class="list-container">Loading...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Link to our JavaScript -->
    <script src="app.js"></script>
</body>
</html>
